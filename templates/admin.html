<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a0a0f">
<title>Admin — Pizzaria Pizzaí</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛵</text></svg>">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0a0f;--surface:#14141c;--line:#242430;--line-2:#2e2e3c;--gold:#e0b94a;--gold-2:#f7e08a;--text:#f5f5f7;--muted:#8a8a96;--dim:#5a5a66;--green:#34d399;--red:#f43f5e;--blue:#60a5fa;--purple:#a78bfa;--orange:#fb923c;--grad:linear-gradient(135deg,#fef3c7 0%,#e0b94a 50%,#b8871a 100%);--ease:cubic-bezier(.22,1,.36,1)}
html{-webkit-text-size-adjust:100%}
body{background:radial-gradient(1200px 700px at 50% -10%,#16161f 0%,#0a0a0f 55%);color:var(--text);font:15px/1.5 system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:8px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#242430;border-radius:10px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#34344a;background-clip:content-box}

.topbar{position:sticky;top:0;z-index:40;background:rgba(10,10,15,.85);backdrop-filter:blur(24px) saturate(180%);border-bottom:1px solid var(--line);padding:14px 28px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand .ico{width:42px;height:42px;border-radius:12px;background:var(--grad);display:grid;place-items:center;font-size:20px;box-shadow:0 8px 20px -8px rgba(224,185,74,.6)}
.brand .txt{display:flex;flex-direction:column;line-height:1.1}
.brand .txt .a{font-size:9px;letter-spacing:.4em;text-transform:uppercase;color:var(--dim);font-weight:700}
.brand .txt .b{font-family:Georgia,serif;font-size:17px;font-weight:900;letter-spacing:.14em;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.status-pill{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:99px;background:rgba(52,211,153,.1);border:1px solid rgba(52,211,153,.3);color:var(--green);font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.status-pill .dot{width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 10px currentColor;animation:pulse 1.8s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.2)}}
.topbar-mid{display:flex;gap:16px;flex:1;justify-content:center;flex-wrap:wrap}
.kpi-mini{display:flex;align-items:center;gap:10px;padding:8px 14px;background:rgba(20,20,28,.7);border:1px solid var(--line);border-radius:12px;font-size:12.5px}
.kpi-mini .ico{font-size:16px}
.kpi-mini .lbl{color:var(--muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.kpi-mini .val{color:var(--gold-2);font-weight:800;font-family:Georgia,serif;font-size:15px}
.top-actions{display:flex;gap:8px;margin-left:auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:11px;font-size:12.5px;font-weight:700;letter-spacing:.04em;transition:all .25s var(--ease);white-space:nowrap;border:1px solid transparent;cursor:pointer}
.btn-ghost{background:rgba(255,255,255,.04);border-color:var(--line-2);color:var(--text)}
.btn-ghost:hover{background:rgba(255,255,255,.08);border-color:var(--gold);color:var(--gold-2)}
.btn-gold{background:var(--grad);color:#0a0a0a;box-shadow:0 6px 16px -6px rgba(224,185,74,.5)}
.btn-gold:hover{transform:translateY(-2px);box-shadow:0 12px 28px -8px rgba(224,185,74,.7)}
.btn-sm{padding:8px 13px;font-size:11.5px}
.btn-icon{width:38px;height:38px;padding:0}
.btn-green{background:linear-gradient(135deg,#6ee7b7,#34d399 50%,#059669);color:#052e16;box-shadow:0 6px 16px -6px rgba(52,211,153,.5)}
.btn-green:hover{transform:translateY(-2px);box-shadow:0 12px 28px -8px rgba(52,211,153,.7)}
.btn-purple{background:linear-gradient(135deg,#c4b5fd,#a78bfa 50%,#7c3aed);color:#0a0a0a}
.btn-red{background:rgba(244,63,94,.12);border-color:rgba(244,63,94,.35);color:var(--red)}
.btn-red:hover{background:var(--red);color:#fff;border-color:var(--red)}

.board-wrap{padding:24px 28px;overflow-x:auto}
.board{display:grid;grid-template-columns:repeat(5,minmax(280px,1fr));gap:16px;min-width:1450px}
.col{background:rgba(15,15,22,.6);border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;max-height:calc(100vh - 200px);overflow:hidden}
.col-head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;background:rgba(20,20,28,.5)}
.col-head .ico{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-size:16px;flex-shrink:0}
.col-head .title{font-size:13.5px;font-weight:900;letter-spacing:.04em;text-transform:uppercase;flex:1}
.col-head .count{font-size:12px;font-weight:900;background:rgba(255,255,255,.08);padding:3px 9px;border-radius:99px;color:var(--muted)}
.col-head.novo .ico{background:rgba(96,165,250,.15);color:var(--blue);border:1px solid rgba(96,165,250,.3)}
.col-head.preparo .ico{background:rgba(251,146,60,.15);color:var(--orange);border:1px solid rgba(251,146,60,.3)}
.col-head.rota .ico{background:rgba(167,139,250,.15);color:var(--purple);border:1px solid rgba(167,139,250,.3)}
.col-head.entregue .ico{background:rgba(52,211,153,.15);color:var(--green);border:1px solid rgba(52,211,153,.3)}
.col-head.cancelado .ico{background:rgba(244,63,94,.15);color:var(--red);border:1px solid rgba(244,63,94,.3)}
.col-body{padding:12px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:10px}

.card{background:linear-gradient(150deg,rgba(28,28,38,.95),rgba(20,20,28,.7));border:1px solid var(--line);border-radius:14px;padding:16px;transition:all .3s var(--ease);cursor:pointer;position:relative;overflow:hidden;animation:cardIn .4s var(--ease)}
@keyframes cardIn{from{opacity:0;transform:scale(.9) translateY(-10px)}to{opacity:1;transform:none}}
.card:hover{border-color:rgba(224,185,74,.4);transform:translateY(-2px);box-shadow:0 12px 24px -12px rgba(0,0,0,.6)}
.card.urgent::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--red);box-shadow:0 0 12px var(--red)}
.card.urgent{animation:urgentPulse 1.5s infinite}
@keyframes urgentPulse{0%,100%{box-shadow:0 0 0 0 rgba(244,63,94,0)}50%{box-shadow:0 0 0 6px rgba(244,63,94,.15)}}
.card-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px}
.card-num{font-family:monospace;font-size:12.5px;font-weight:900;color:var(--gold-2);letter-spacing:.02em}
.card-time{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:5px}
.card-client{font-weight:800;font-size:14px;margin-bottom:8px;line-height:1.3}
.card-address{font-size:12px;color:var(--muted);line-height:1.5;margin-bottom:12px;padding-bottom:12px;border-bottom:1px dashed rgba(255,255,255,.06)}
.card-address strong{color:var(--text);font-weight:700;display:block;margin-bottom:2px}
.card-items{font-size:12px;color:var(--muted);margin-bottom:12px;max-height:60px;overflow:hidden;line-height:1.5}
.card-items b{color:var(--text);font-weight:700}
.card-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:12px;border-top:1px solid rgba(255,255,255,.06)}
.card-total{font-family:Georgia,serif;font-size:18px;font-weight:900;color:var(--gold-2);letter-spacing:-.02em}
.card-pay{font-size:10.5px;color:var(--muted);padding:3px 9px;border-radius:6px;background:rgba(255,255,255,.05);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.card-actions{display:flex;gap:6px;margin-top:12px}
.card-actions .btn{flex:1;padding:9px 12px;font-size:11px}
.card-actions .btn-icon{flex:0 0 40px;width:40px}
.col-body:empty::after{content:'Nenhum pedido';display:block;text-align:center;padding:40px 16px;color:var(--dim);font-size:12px}

.modal{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:20px;background:rgba(0,0,0,.85);backdrop-filter:blur(8px);opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s}
.modal.on{opacity:1;visibility:visible}
.modal-box{width:100%;max-width:620px;background:rgba(20,20,28,.98);border:1px solid var(--line-2);border-radius:22px;padding:28px;position:relative;box-shadow:0 40px 80px -30px rgba(0,0,0,.95);transform:scale(.95) translateY(10px);transition:transform .35s var(--ease);max-height:90vh;overflow-y:auto}
.modal.on .modal-box{transform:none}
.modal-x{position:absolute;top:16px;right:16px;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);color:var(--muted);font-size:19px;display:grid;place-items:center;transition:all .25s}
.modal-x:hover{background:var(--red);border-color:var(--red);color:#fff}
.modal h2{font-family:Georgia,serif;font-size:22px;font-weight:900;margin-bottom:6px}
.modal .sub{font-size:13px;color:var(--muted);margin-bottom:22px}
.modal-grid{display:grid;gap:12px}
.info-box{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.info-box .lbl{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:900;margin-bottom:8px}
.info-box .val{font-size:13.5px;line-height:1.6}
.info-box .val strong{color:var(--gold-2);font-weight:800}
.itens-list{list-style:none;padding:0}
.itens-list li{padding:10px 0;border-bottom:1px solid rgba(255,255,255,.05);display:flex;justify-content:space-between;gap:12px;font-size:13.5px}
.itens-list li:last-child{border-bottom:0}
.itens-list li b{color:var(--gold-2);font-weight:800;white-space:nowrap}
.total-row{display:flex;justify-content:space-between;padding:16px 0 0;margin-top:12px;border-top:2px solid var(--gold);font-size:15px}
.total-row .v{font-family:Georgia,serif;font-size:24px;color:var(--gold-2);font-weight:900}
.modal-actions{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.modal-actions .btn{flex:1;min-width:140px}
.progress-steps{display:flex;gap:6px;margin-bottom:18px}
.step{flex:1;height:4px;border-radius:4px;background:rgba(255,255,255,.08);transition:background .3s}
.step.done{background:var(--grad);box-shadow:0 0 12px rgba(224,185,74,.5)}
.step.current{background:var(--gold);animation:pulse 1.8s infinite}

.toast{position:fixed;bottom:26px;left:50%;transform:translate(-50%,140%);z-index:200;padding:14px 24px;background:rgba(20,20,28,.98);border:1px solid rgba(224,185,74,.4);border-radius:99px;color:var(--text);font-size:13px;font-weight:600;box-shadow:0 24px 55px -18px rgba(0,0,0,.95);transition:transform .4s var(--ease);pointer-events:none;max-width:90vw;text-align:center}
.toast.on{transform:translate(-50%,0)}
.notif{position:fixed;top:20px;right:20px;z-index:150;padding:16px 20px;background:rgba(20,20,28,.98);border:1px solid rgba(224,185,74,.5);border-radius:14px;box-shadow:0 24px 55px -18px rgba(0,0,0,.9);display:flex;align-items:center;gap:14px;min-width:300px;max-width:400px;transform:translateX(500px);transition:transform .4s var(--ease);cursor:pointer}
.notif.on{transform:none}
.notif .ico{width:44px;height:44px;border-radius:12px;background:var(--grad);display:grid;place-items:center;font-size:22px;flex-shrink:0;animation:pulse 1.8s infinite}
.notif .txt .t{font-weight:800;font-size:14px;margin-bottom:3px}
.notif .txt .s{font-size:12.5px;color:var(--muted)}

@media(max-width:768px){
  .topbar{padding:12px 16px}
  .topbar-mid{display:none}
  .board-wrap{padding:16px}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="ico">🛵</div>
    <div class="txt">
      <span class="a">Delivery</span>
      <span class="b">PIZZAÍ</span>
    </div>
  </div>
  <span class="status-pill"><span class="dot"></span> Operando</span>
  <div class="topbar-mid">
    <div class="kpi-mini"><span class="ico">📦</span><span class="lbl">Hoje</span><span class="val" id="kpiHoje">0</span></div>
    <div class="kpi-mini"><span class="ico">💰</span><span class="lbl">Faturado</span><span class="val" id="kpiFaturado">R$ 0</span></div>
    <div class="kpi-mini"><span class="ico">🛵</span><span class="lbl">Em rota</span><span class="val" id="kpiRota">0</span></div>
    <div class="kpi-mini"><span class="ico">⏱</span><span class="lbl">Tempo médio</span><span class="val" id="kpiTempo">—</span></div>
  </div>
  <div class="top-actions">
    <button class="btn btn-ghost btn-sm" data-action="refresh">🔄</button>
    <button class="btn btn-ghost btn-sm" data-action="sound" id="soundBtn">🔔 <span id="soundLabel">Ligado</span></button>
    <button class="btn btn-gold btn-sm" data-action="fullscreen">⛶ Tela cheia</button>
  </div>
</header>

<div class="board-wrap">
  <div class="board">
    <div class="col">
      <div class="col-head novo">
        <div class="ico">🔔</div>
        <div class="title">Novos</div>
        <span class="count" id="cNovos">0</span>
      </div>
      <div class="col-body" id="colNovos"></div>
    </div>
    <div class="col">
      <div class="col-head preparo">
        <div class="ico">👨‍🍳</div>
        <div class="title">Em Preparo</div>
        <span class="count" id="cPreparo">0</span>
      </div>
      <div class="col-body" id="colPreparo"></div>
    </div>
    <div class="col">
      <div class="col-head rota">
        <div class="ico">🛵</div>
        <div class="title">Em Rota</div>
        <span class="count" id="cRota">0</span>
      </div>
      <div class="col-body" id="colRota"></div>
    </div>
    <div class="col">
      <div class="col-head entregue">
        <div class="ico">✅</div>
        <div class="title">Entregues</div>
        <span class="count" id="cEntregues">0</span>
      </div>
      <div class="col-body" id="colEntregues"></div>
    </div>
    <div class="col">
      <div class="col-head cancelado">
        <div class="ico">❌</div>
        <div class="title">Cancelados</div>
        <span class="count" id="cCancelados">0</span>
      </div>
      <div class="col-body" id="colCancelados"></div>
    </div>
  </div>
</div>

<div class="modal" id="modal">
  <div class="modal-box">
    <button class="modal-x" data-action="close-modal">×</button>
    <h2 id="modalTitle">Pedido</h2>
    <p class="sub" id="modalSub">—</p>
    <div class="progress-steps" id="progressSteps">
      <div class="step" data-step="1"></div>
      <div class="step" data-step="2"></div>
      <div class="step" data-step="3"></div>
      <div class="step" data-step="4"></div>
    </div>
    <div class="modal-grid" id="modalBody"></div>
    <div class="modal-actions" id="modalActions"></div>
  </div>
</div>

<div class="notif" id="notif">
  <div class="ico">🔔</div>
  <div class="txt">
    <div class="t" id="notifTitle">Novo pedido</div>
    <div class="s" id="notifSub">Cliente fez um pedido</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';
const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>Array.prototype.slice.call((r||document).querySelectorAll(s));
const brl=n=>Number(n||0).toFixed(2).replace('.',',');
const money=n=>'R$ '+brl(n);
const STATUS={novo:'novo',preparo:'preparo',rota:'rota',entregue:'entregue',cancelado:'cancelado'};
let orders=[];
let soundEnabled=true;
let audioCtx=null;

function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();}
function beep(freq=800,dur=0.15){if(!soundEnabled)return;try{initAudio();const o=audioCtx.createOscillator();const g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(0.3,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+dur);o.start();o.stop(audioCtx.currentTime+dur);}catch(e){}}
function alertNewOrder(){beep(880,0.15);setTimeout(()=>beep(1100,0.15),180);setTimeout(()=>beep(880,0.2),360);}

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2400);}
function notif(title,sub){$('#notifTitle').textContent=title;$('#notifSub').textContent=sub;$('#notif').classList.add('on');setTimeout(()=>$('#notif').classList.remove('on'),4000);}

/* ✅ STATUS VEM DO SERVIDOR */
function getStoredStatus(id){
  const o = orders.find(x => x.numero === id);
  return (o && o.status) || STATUS.novo;
}
async function setStoredStatus(id, st){
  const o = orders.find(x => x.numero === id);
  if(o) o.status = st;
  try{
    await fetch('/api/pedido/' + encodeURIComponent(id) + '/status', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({status: st})
    });
  }catch(e){ console.warn('Erro ao salvar status:', e); }
}

function timeAgo(iso){if(!iso)return '';const d=new Date(iso);const diff=(Date.now()-d.getTime())/1000;if(diff<60)return 'agora';if(diff<3600)return Math.floor(diff/60)+'min';if(diff<86400)return Math.floor(diff/3600)+'h '+Math.floor((diff%3600)/60)+'min';return Math.floor(diff/86400)+'d';}
function minutesSince(iso){if(!iso)return 999;return (Date.now()-new Date(iso).getTime())/60000;}
function fmtDate(iso){if(!iso)return '';try{return new Date(iso).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});}catch(e){return iso;}}

function renderCard(o){
  const st=getStoredStatus(o.numero);
  const mins=minutesSince(o.recebido_em);
  const urgent=mins>20&&(st===STATUS.novo||st===STATUS.preparo);
  const itensFull=(o.itens||[]).map(i=>'<b>'+i.qtd+'x</b> '+i.nome).join(' · ');
  const endereco=o.modo==='retirada'?('<strong>🏪 Retirada no balcão</strong>Av. Vale das Pedrinhas, 56'):('<strong>'+(o.rua||'')+', '+(o.numero||'')+'</strong>'+(o.bairro||'')+' · '+(o.cidade||''));
  const pay={dinheiro:'💵 Dinheiro',cartao:'💳 Cartão',pix:'⚡ Pix'}[o.pagamento]||o.pagamento||'—';
  let actions='';
  if(st===STATUS.novo)actions='<button class="btn btn-gold btn-sm" data-action="move" data-id="'+o.numero+'" data-to="preparo">👨‍🍳 Preparar</button><button class="btn btn-ghost btn-icon" data-action="details" data-id="'+o.numero+'">👁</button>';
  else if(st===STATUS.preparo)actions='<button class="btn btn-purple btn-sm" data-action="move" data-id="'+o.numero+'" data-to="rota">🛵 Enviar</button><button class="btn btn-ghost btn-icon" data-action="details" data-id="'+o.numero+'">👁</button>';
  else if(st===STATUS.rota)actions='<button class="btn btn-green btn-sm" data-action="move" data-id="'+o.numero+'" data-to="entregue">✅ Entregue</button><button class="btn btn-ghost btn-icon" data-action="details" data-id="'+o.numero+'">👁</button>';
  else if(st===STATUS.entregue)actions='<button class="btn btn-ghost btn-sm" data-action="details" data-id="'+o.numero+'">👁 Detalhes</button>';
  else if(st===STATUS.cancelado)actions='<button class="btn btn-ghost btn-sm" data-action="move" data-id="'+o.numero+'" data-to="novo">↩ Restaurar</button>';
  return '<div class="card '+(urgent?'urgent':'')+'" data-id="'+o.numero+'">'+
    '<div class="card-top"><span class="card-num">'+(o.numero||'#')+'</span><span class="card-time">⏱ '+timeAgo(o.recebido_em)+'</span></div>'+
    '<div class="card-client">'+(o.nome||'—')+'</div>'+
    '<div class="card-address">'+endereco+'</div>'+
    '<div class="card-items">'+itensFull+'</div>'+
    '<div class="card-foot"><span class="card-total">'+money(o.total||0)+'</span><span class="card-pay">'+pay+'</span></div>'+
    '<div class="card-actions">'+actions+'</div>'+
  '</div>';
}

function render(){
  const byStatus={novo:[],preparo:[],rota:[],entregue:[],cancelado:[]};
  orders.forEach(o=>{const st=getStoredStatus(o.numero);(byStatus[st]||byStatus.novo).push(o);});
  Object.keys(byStatus).forEach(k=>{
    const col=$('#col'+k.charAt(0).toUpperCase()+k.slice(1));
    if(!col)return;
    const list=byStatus[k].sort((a,b)=>new Date(b.recebido_em)-new Date(a.recebido_em));
    col.innerHTML=list.length?list.map(renderCard).join(''):'';
    const cnt=$('#c'+k.charAt(0).toUpperCase()+k.slice(1));
    if(cnt)cnt.textContent=list.length;
  });
  updateKPIs();
}

function updateKPIs(){
  const today=orders.filter(o=>{const d=new Date(o.recebido_em);const t=new Date();return d.getDate()===t.getDate()&&d.getMonth()===t.getMonth()&&d.getFullYear()===t.getFullYear();});
  const faturado=today.reduce((s,o)=>s+Number(o.total||0),0);
  const rota=orders.filter(o=>getStoredStatus(o.numero)===STATUS.rota).length;
  let tempoMedio='—';
  const entregues=today.filter(o=>getStoredStatus(o.numero)===STATUS.entregue);
  if(entregues.length>0){
    const soma=entregues.reduce((s,o)=>s+minutesSince(o.recebido_em),0);
    tempoMedio=Math.round(soma/entregues.length)+'min';
  }
  $('#kpiHoje').textContent=today.length;
  $('#kpiFaturado').textContent=money(faturado);
  $('#kpiRota').textContent=rota;
  $('#kpiTempo').textContent=tempoMedio;
}

async function moveOrder(id,to){
  await setStoredStatus(id,to);
  const labels={novo:'Novo',preparo:'Em Preparo',rota:'Em Rota',entregue:'Entregue',cancelado:'Cancelado'};
  toast('Pedido '+id+' → '+(labels[to]||to));
  render();
}

function openDetails(id){
  const o=orders.find(x=>x.numero===id);
  if(!o)return;
  const st=getStoredStatus(o.numero);
  const itens=(o.itens||[]).map(i=>{
    const adds=i.addons&&i.addons.length?'<br><span style="font-size:11.5px;color:var(--gold-2)">+ '+i.addons.join(', ')+'</span>':'';
    return '<li><span>'+i.qtd+'x '+i.nome+adds+'</span><b>'+money(Number(i.preco||0)*Number(i.qtd||1))+'</b></li>';
  }).join('');
  const endereco=o.modo==='retirada'?'<strong>Retirada no balcão</strong><br>Av. Vale das Pedrinhas, 56 - Salvador/BA':('<strong>'+(o.rua||'')+', '+(o.numero||'')+'</strong>'+(o.complemento?' - '+o.complemento:'')+'<br>'+(o.bairro||'')+'<br>'+(o.cidade||'')+(o.estado?' - '+o.estado:'')+'<br>CEP: '+(o.cep||'')+(o.referencia?'<br><em style="color:var(--muted)">Ref: '+o.referencia+'</em>':''));
  const pagto={dinheiro:'💵 Dinheiro',cartao:'💳 Cartão',pix:'⚡ Pix'}[o.pagamento]||o.pagamento||'—';
  $('#modalTitle').textContent='Pedido '+(o.numero||'');
  $('#modalSub').textContent=fmtDate(o.recebido_em)+' · '+timeAgo(o.recebido_em)+' atrás';
  const steps=['novo','preparo','rota','entregue'];
  const curIdx=steps.indexOf(st);
  $$('#progressSteps .step').forEach((el,i)=>{
    el.classList.remove('done','current');
    if(i<curIdx)el.classList.add('done');
    else if(i===curIdx)el.classList.add('current');
  });
  $('#modalBody').innerHTML=
    '<div class="info-box"><div class="lbl">👤 Cliente</div><div class="val"><strong>'+(o.nome||'—')+'</strong>'+(o.telefone?'<br>'+o.telefone:'')+'</div></div>'+
    '<div class="info-box"><div class="lbl">📍 '+(o.modo==='retirada'?'Retirada':'Endereço')+'</div><div class="val">'+endereco+'</div></div>'+
    '<div class="info-box"><div class="lbl">🍕 Itens</div><ul class="itens-list">'+itens+'</ul></div>'+
    '<div class="info-box"><div class="lbl">💳 Pagamento</div><div class="val">'+pagto+(o.troco?'<br>Troco para: <strong>'+o.troco+'</strong>':'')+'</div></div>'+
    '<div class="total-row"><span>Total</span><span class="v">'+money(o.total||0)+'</span></div>';
  let actions='';
  if(o.telefone)actions+='<button class="btn btn-ghost" data-action="whats" data-id="'+o.numero+'">💬 WhatsApp</button>';
  if(st===STATUS.novo){
    actions+='<button class="btn btn-red" data-action="move" data-id="'+o.numero+'" data-to="cancelado">❌ Cancelar</button>';
    actions+='<button class="btn btn-gold" data-action="move" data-id="'+o.numero+'" data-to="preparo">👨‍🍳 Preparar</button>';
  }else if(st===STATUS.preparo){
    actions+='<button class="btn btn-red" data-action="move" data-id="'+o.numero+'" data-to="cancelado">❌ Cancelar</button>';
    actions+='<button class="btn btn-purple" data-action="move" data-id="'+o.numero+'" data-to="rota">🛵 Enviar</button>';
  }else if(st===STATUS.rota){
    actions+='<button class="btn btn-green" data-action="move" data-id="'+o.numero+'" data-to="entregue">✅ Entregue</button>';
  }else if(st===STATUS.entregue){
    actions+='<button class="btn btn-ghost" data-action="move" data-id="'+o.numero+'" data-to="rota">↩ Reabrir</button>';
  }else{
    actions+='<button class="btn btn-ghost" data-action="move" data-id="'+o.numero+'" data-to="novo">↩ Restaurar</button>';
  }
  $('#modalActions').innerHTML=actions;
  $('#modal').classList.add('on');
}

document.addEventListener('click',function(e){
  const el=e.target.closest('[data-action]');
  if(el){
    const a=el.dataset.action;
    if(a==='close-modal'){$('#modal').classList.remove('on');return;}
    if(a==='refresh'){loadOrders();toast('Atualizado');return;}
    if(a==='sound'){soundEnabled=!soundEnabled;$('#soundBtn').classList.toggle('btn-ghost',!soundEnabled);$('#soundLabel').textContent=soundEnabled?'Ligado':'Mudo';toast(soundEnabled?'🔔 Som ligado':'🔕 Som mudo');return;}
    if(a==='fullscreen'){if(!document.fullscreenElement)document.documentElement.requestFullscreen();else document.exitFullscreen();return;}
    if(a==='move'){moveOrder(el.dataset.id,el.dataset.to);$('#modal').classList.remove('on');return;}
    if(a==='details'){openDetails(el.dataset.id);return;}
    if(a==='whats'){const o=orders.find(x=>x.numero===el.dataset.id);if(o&&o.telefone){const tel=o.telefone.replace(/\D/g,'');const msg='Ola '+(o.nome||'')+'! Seu pedido '+(o.numero||'')+' esta sendo preparado.';window.open('https://wa.me/55'+tel+'?text='+encodeURIComponent(msg),'_blank');}return;}
  }
  const card=e.target.closest('.card');
  if(card&&!e.target.closest('.btn')){openDetails(card.dataset.id);return;}
  if(e.target===$('#modal'))$('#modal').classList.remove('on');
});

document.addEventListener('keydown',e=>{
  if(e.key==='Escape')$('#modal').classList.remove('on');
  if(e.key==='r'&&!e.target.matches('input,textarea')){loadOrders();toast('Atualizado');}
});

async function loadOrders(){
  try{
    const res=await fetch('/api/pedidos',{cache:'no-store'});
    if(!res.ok)throw new Error('Erro '+res.status);
    const data=await res.json();
    orders=(data.pedidos||[]);
    render();
  }catch(e){console.error(e);}
}

function conectarSSE(){
  try{
    const es = new EventSource('/api/pedidos/stream');

    es.addEventListener('pedido', (ev) => {
      try{
        const pedido = JSON.parse(ev.data);
        const existente = orders.find(o => o.numero === pedido.numero);

        if(existente){
          if(pedido.status) existente.status = pedido.status;
          render();
          return;
        }

        orders.unshift(pedido);
        notif('🔔 Novo pedido ' + (pedido.numero||''), (pedido.nome||'') + ' · R$ ' + Number(pedido.total||0).toFixed(2).replace('.',','));
        alertNewOrder();
        render();
      }catch(err){
        console.warn('Erro SSE:', err);
      }
    });

    es.onerror = () => {
      console.warn('SSE caiu, reconectando em 3s...');
      es.close();
      setTimeout(conectarSSE, 3000);
    };

    console.log('✅ SSE conectado — painel tempo real');
  }catch(e){
    console.error('Erro SSE:', e);
    setInterval(loadOrders, 5000);
  }
}

loadOrders().then(() => conectarSSE());

setInterval(loadOrders, 30000);
setInterval(render, 30000);

})();
</script>
